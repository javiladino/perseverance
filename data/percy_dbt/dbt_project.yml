name: percy
version: "1.0.0"
profile: percy

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  percy:
    +meta:
      dagster:
        group: transformation  # grupo en el linaje de Dagster
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  percy:
    +meta:
      dagster:
        group: transformation
    +schema: seeds

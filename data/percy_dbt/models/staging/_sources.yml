version: 2

sources:
  - name: nasa
    description: Datos crudos cargados por dlt (percy_pipeline/ingestion/nasa.py).
    schema: raw
    tables:
      - name: waypoints
        description: Una fila por parada del rover (historial de manejos, M20_waypoints.json).
      - name: raw_images
        description: Imágenes sin procesar de la API de NASA, cargadas de forma incremental.
        loaded_at_field: date_received
        freshness:
          warn_after: {count: 3, period: day}
          error_after: {count: 7, period: day}
      - name: light_time
        description: Tiempo de luz Tierra–Marte por sol, calculado en percy_pipeline/orbits.py.

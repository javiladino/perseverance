[project]
name = "percy-pipeline"
version = "0.1.0"
description = "Plataforma de datos de Percy: NASA → dlt → DuckDB → dbt → Dagster → juego"
requires-python = ">=3.12"
dependencies = [
  "dagster>=1.11",
  "dagster-webserver>=1.11",
  "dagster-dbt>=0.27",
  "dbt-duckdb>=1.9",
  "dlt[duckdb]>=1.10",
  "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.dagster]
module_name = "percy_pipeline.definitions"
code_location_name = "percy"

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["percy_pipeline"]
